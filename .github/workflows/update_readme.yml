name: Update GitHub Stats & SVG Cards in README

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Dynamic SVG Cards & Update README
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python -c "
          import urllib.request, json, os, re, textwrap

          username = os.environ.get('GITHUB_USERNAME', 'GSaiDheeraj')
          pat = os.environ.get('GH_PAT', '').strip()
          token = pat if pat else os.environ.get('GITHUB_TOKEN', '').strip()

          headers = {'User-Agent': 'Python'}
          if token:
              headers['Authorization'] = f'token {token}'

          repos = []
          page = 1

          if pat:
              while True:
                  url = f'https://api.github.com/user/repos?visibility=all&per_page=100&page={page}'
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          data = json.loads(resp.read().decode())
                          if not data:
                              break
                          repos.extend(data)
                          page += 1
                  except Exception as e:
                      print('Error with PAT user repos, falling back to public repos:', e)
                      repos = []
                      break

          if not repos:
              page = 1
              while True:
                  url = f'https://api.github.com/users/{username}/repos?per_page=100&page={page}'
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          data = json.loads(resp.read().decode())
                          if not data:
                              break
                          repos.extend(data)
                          page += 1
                  except Exception as e:
                      print('Error fetching public repos:', e)
                      break

          total_repos = len(repos)
          stars = sum(r.get('stargazers_count', 0) for r in repos)
          forks = sum(r.get('forks_count', 0) for r in repos)

          total_commits = 0
          for r in repos:
              repo_owner = r.get('owner', {}).get('login', username)
              repo_name = r.get('name')
              c_url = f'https://api.github.com/repos/{repo_owner}/{repo_name}/commits?per_page=1'
              req = urllib.request.Request(c_url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      link_header = resp.headers.get('Link', '')
                      if 'rel=\"last\"' in link_header:
                          m = re.search(r'page=(\d+)>; rel=\"last\"', link_header)
                          if m:
                              total_commits += int(m.group(1))
                          else:
                              total_commits += len(json.loads(resp.read().decode()))
                      else:
                          total_commits += len(json.loads(resp.read().decode()))
              except Exception:
                  pass

          score = (stars * 4) + (forks * 3) + (total_repos * 2) + (total_commits * 0.5)
          if score > 200:
              rank = 'A++'
          elif score > 100:
              rank = 'A+'
          elif score > 50:
              rank = 'A'
          else:
              rank = 'B+'

          langs = {}
          for r in repos:
              l = r.get('language')
              if l:
                  langs[l] = langs.get(l, 0) + 1

          total_lang_count = sum(langs.values()) if langs else 1
          top_langs = sorted(langs.items(), key=lambda x: x[1], reverse=True)[:5]

          stats_svg = f'''<svg width=\"450\" height=\"210\" viewBox=\"0 0 450 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">
            <defs>
              <linearGradient id=\"gradStats\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">
                <stop offset=\"0%\" stop-color=\"#0F172A\" />
                <stop offset=\"100%\" stop-color=\"#1E293B\" />
              </linearGradient>
              <linearGradient id=\"textGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">
                <stop offset=\"0%\" stop-color=\"#38BDF8\" />
                <stop offset=\"100%\" stop-color=\"#818CF8\" />
              </linearGradient>
            </defs>
            <rect width=\"450\" height=\"210\" fill=\"url(#gradStats)\" stroke=\"#334155\" stroke-width=\"1.5\" rx=\"14\" />
            <text x=\"28\" y=\"38\" font-family=\"'Segoe UI', Ubuntu, sans-serif\" font-weight=\"700\" font-size=\"18\" fill=\"url(#textGrad)\">⚡ {username}'s GitHub Overview</text>

            <g font-family=\"'Segoe UI', Ubuntu, sans-serif\" font-size=\"14\">
              <text x=\"28\" y=\"75\" fill=\"#94A3B8\">Total Commits:</text>
              <text x=\"165\" y=\"75\" font-weight=\"600\" fill=\"#F8FAFC\">{total_commits}</text>

              <text x=\"28\" y=\"105\" fill=\"#94A3B8\">Total Stars:</text>
              <text x=\"165\" y=\"105\" font-weight=\"600\" fill=\"#F8FAFC\">{stars}</text>

              <text x=\"28\" y=\"135\" fill=\"#94A3B8\">Total Repositories:</text>
              <text x=\"165\" y=\"135\" font-weight=\"600\" fill=\"#F8FAFC\">{total_repos}</text>

              <text x=\"28\" y=\"165\" fill=\"#94A3B8\">Total Forks:</text>
              <text x=\"165\" y=\"165\" font-weight=\"600\" fill=\"#F8FAFC\">{forks}</text>
            </g>

            <circle cx=\"365\" cy=\"115\" r=\"44\" fill=\"#0284C7\" fill-opacity=\"0.15\" stroke=\"#38BDF8\" stroke-width=\"2.5\" />
            <text x=\"365\" y=\"124\" text-anchor=\"middle\" font-family=\"'Segoe UI', Ubuntu, sans-serif\" font-weight=\"800\" font-size=\"28\" fill=\"#38BDF8\">{rank}</text>
          </svg>'''

          with open('github-stats.svg', 'w', encoding='utf-8') as f:
              f.write(stats_svg)

          lang_colors = ['#38BDF8', '#818CF8', '#F43F5E', '#10B981', '#F59E0B']
          lang_items_svg = ''
          y_offset = 72
          for i, (lang_name, count) in enumerate(top_langs):
              pct = round((count / total_lang_count) * 100, 1)
              color = lang_colors[i % len(lang_colors)]
              lang_items_svg += f'''
              <text x=\"28\" y=\"{y_offset}\" font-family=\"'Segoe UI', Ubuntu, sans-serif\" font-size=\"13\" fill=\"#CBD5E1\">{lang_name}</text>
              <rect x=\"160\" y=\"{y_offset - 10}\" width=\"180\" height=\"8\" rx=\"4\" fill=\"#334155\" />
              <rect x=\"160\" y=\"{y_offset - 10}\" width=\"{int(180 * (pct/100))}\" height=\"8\" rx=\"4\" fill=\"{color}\" />
              <text x=\"352\" y=\"{y_offset}\" font-family=\"'Segoe UI', Ubuntu, sans-serif\" font-weight=\"600\" font-size=\"13\" fill=\"#F8FAFC\">{pct}%</text>
              '''
              y_offset += 26

          langs_svg = f'''<svg width=\"420\" height=\"210\" viewBox=\"0 0 420 210\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">
            <defs>
              <linearGradient id=\"gradLangs\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">
                <stop offset=\"0%\" stop-color=\"#0F172A\" />
                <stop offset=\"100%\" stop-color=\"#1E293B\" />
              </linearGradient>
              <linearGradient id=\"textGradL\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\">
                <stop offset=\"0%\" stop-color=\"#38BDF8\" />
                <stop offset=\"100%\" stop-color=\"#818CF8\" />
              </linearGradient>
            </defs>
            <rect width=\"420\" height=\"210\" fill=\"url(#gradLangs)\" stroke=\"#334155\" stroke-width=\"1.5\" rx=\"14\" />
            <text x=\"28\" y=\"38\" font-family=\"'Segoe UI', Ubuntu, sans-serif\" font-weight=\"700\" font-size=\"18\" fill=\"url(#textGradL)\">🚀 Most Used Languages</text>
            {lang_items_svg}
          </svg>'''

          with open('top-langs.svg', 'w', encoding='utf-8') as f:
              f.write(langs_svg)

          readme_section = textwrap.dedent('''<!--START_SECTION:stats-->
          <p align=\"center\">
            <img src=\"github-stats.svg\" alt=\"GitHub Stats\" />
            &nbsp;&nbsp;
            <img src=\"top-langs.svg\" alt=\"Top Languages\" />
          </p>
          <!--END_SECTION:stats-->''')

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!--START_SECTION:stats-->.*?<!--END_SECTION:stats-->'
          updated_content = re.sub(pattern, readme_section, content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and push generated cards & README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg README.md
          git diff --staged --quiet || git commit -m "Update dynamic GitHub stats SVG cards including private repos in README"
          git push || true
