name: Update GitHub Stats in README

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Update README with GitHub Stats
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import urllib.request, json, os, re, textwrap

          username = os.environ.get('GITHUB_USERNAME', 'GSaiDheeraj')
          token = os.environ.get('GITHUB_TOKEN', '')

          repos = []
          page = 1
          while True:
              url = f'https://api.github.com/users/{username}/repos?per_page=100&page={page}'
              req = urllib.request.Request(url, headers={'User-Agent': 'Python'})
              if token:
                  req.add_header('Authorization', f'token {token}')
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      if not data:
                          break
                      repos.extend(data)
                      page += 1
              except Exception as e:
                  print('Error fetching repos:', e)
                  break

          public_repos = len(repos)
          stars = sum(r.get('stargazers_count', 0) for r in repos)
          forks = sum(r.get('forks_count', 0) for r in repos)

          langs = {}
          for r in repos:
              l = r.get('language')
              if l:
                  langs[l] = langs.get(l, 0) + 1

          top_langs = sorted(langs.items(), key=lambda x: x[1], reverse=True)[:5]
          top_langs_str = ', '.join([f'{lang} ({count})' for lang, count in top_langs]) if top_langs else 'N/A'

          stats_table = textwrap.dedent(f'''<!--START_SECTION:stats-->
          <div align=\"center\">

          ### 📊 Git Repository Stats & Overview

          | Metric | Count / Details |
          | :--- | :--- |
          | 📦 **Public Repositories** | {public_repos} |
          | ⭐ **Total Stargazers** | {stars} Stars |
          | 🔀 **Total Repository Forks** | {forks} Forks |
          | 💻 **Top Languages** | {top_langs_str} |
          | 🧑‍💻 **Role** | Machine Learning Engineer |
          | 🎓 **Education** | Master's Degree in Data Science |

          </div>
          <!--END_SECTION:stats-->''')

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!--START_SECTION:stats-->.*?<!--END_SECTION:stats-->'
          updated_content = re.sub(pattern, stats_table, content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Update GitHub repo stats in README"
          git push || true
