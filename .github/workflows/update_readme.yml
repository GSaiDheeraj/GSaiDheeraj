name: Update GitHub Stats & SVG Cards in README

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Dynamic SVG Cards & Update README
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import urllib.request, json, os, re, textwrap

          username = os.environ.get('GITHUB_USERNAME', 'GSaiDheeraj')
          token = os.environ.get('GITHUB_TOKEN', '')

          headers = {'User-Agent': 'Python'}
          if token:
              headers['Authorization'] = f'token {token}'

          # Fetch Repositories
          repos = []
          page = 1
          while True:
              url = f'https://api.github.com/users/{username}/repos?per_page=100&page={page}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      if not data:
                          break
                      repos.extend(data)
                      page += 1
              except Exception as e:
                  print('Error fetching repos:', e)
                  break

          public_repos = len(repos)
          stars = sum(r.get('stargazers_count', 0) for r in repos)
          forks = sum(r.get('forks_count', 0) for r in repos)

          # Calculate total commits via repo commits API
          total_commits = 0
          for r in repos:
              repo_name = r.get('name')
              c_url = f'https://api.github.com/repos/{username}/{repo_name}/commits?per_page=1'
              req = urllib.request.Request(c_url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      link_header = resp.headers.get('Link', '')
                      if 'rel=\"last\"' in link_header:
                          m = re.search(r'page=(\d+)>; rel=\"last\"', link_header)
                          if m:
                              total_commits += int(m.group(1))
                          else:
                              total_commits += len(json.loads(resp.read().decode()))
                      else:
                          total_commits += len(json.loads(resp.read().decode()))
              except Exception:
                  pass

          # Calculate Grade / Rank (A++, A+, A, B+)
          score = (stars * 4) + (forks * 3) + (public_repos * 2) + (total_commits * 0.5)
          if score > 200:
              rank = 'A++'
          elif score > 100:
              rank = 'A+'
          elif score > 50:
              rank = 'A'
          else:
              rank = 'B+'

          # Language Breakdown
          langs = {}
          for r in repos:
              l = r.get('language')
              if l:
                  langs[l] = langs.get(l, 0) + 1

          total_lang_count = sum(langs.values()) if langs else 1
          top_langs = sorted(langs.items(), key=lambda x: x[1], reverse=True)[:5]

          # Generate stats SVG Card
          stats_svg = f'''<svg width=\"450\" height=\"200\" viewBox=\"0 0 450 200\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">
            <style>
              .header {{ font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #4801FF; }}
              .stat {{ font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #C9D1D9; }}
              .stat-bold {{ font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58A6FF; }}
              .rank-circle {{ font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38EF7D; }}
              .bg {{ fill: #0D1117; stroke: #30363D; stroke-width: 1px; rx: 10px; }}
            </style>
            <rect width=\"450\" height=\"200\" class=\"bg\" />
            <text x=\"25\" y=\"35\" class=\"header\">{username}'s GitHub Stats</text>

            <text x=\"25\" y=\"70\" class=\"stat\">Total Commits:</text>
            <text x=\"160\" y=\"70\" class=\"stat-bold\">{total_commits}</text>

            <text x=\"25\" y=\"98\" class=\"stat\">Total Stars:</text>
            <text x=\"160\" y=\"98\" class=\"stat-bold\">{stars}</text>

            <text x=\"25\" y=\"126\" class=\"stat\">Total Repos:</text>
            <text x=\"160\" y=\"126\" class=\"stat-bold\">{public_repos}</text>

            <text x=\"25\" y=\"154\" class=\"stat\">Total Forks:</text>
            <text x=\"160\" y=\"154\" class=\"stat-bold\">{forks}</text>

            <circle cx=\"360\" cy=\"105\" r=\"45\" fill=\"#161B22\" stroke=\"#38EF7D\" stroke-width=\"3\"/>
            <text x=\"360\" y=\"115\" text-anchor=\"middle\" class=\"rank-circle\">{rank}</text>
          </svg>'''

          with open('github-stats.svg', 'w', encoding='utf-8') as f:
              f.write(stats_svg)

          # Generate Languages SVG Card
          lang_colors = ['#3572A5', '#DA5B0B', '#F1E05A', '#E34C26', '#563D7C']
          lang_items_svg = ''
          y_offset = 65
          for i, (lang_name, count) in enumerate(top_langs):
              pct = round((count / total_lang_count) * 100, 1)
              color = lang_colors[i % len(lang_colors)]
              lang_items_svg += f'''
              <text x=\"25\" y=\"{y_offset}\" class=\"stat\">{lang_name}</text>
              <rect x=\"160\" y=\"{y_offset - 10}\" width=\"180\" height=\"8\" rx=\"4\" fill=\"#161B22\" />
              <rect x=\"160\" y=\"{y_offset - 10}\" width=\"{int(180 * (pct/100))}\" height=\"8\" rx=\"4\" fill=\"{color}\" />
              <text x=\"350\" y=\"{y_offset}\" class=\"stat-bold\">{pct}%</text>
              '''
              y_offset += 26

          langs_svg = f'''<svg width=\"420\" height=\"200\" viewBox=\"0 0 420 200\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">
            <style>
              .header {{ font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #4801FF; }}
              .stat {{ font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #C9D1D9; }}
              .stat-bold {{ font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58A6FF; }}
              .bg {{ fill: #0D1117; stroke: #30363D; stroke-width: 1px; rx: 10px; }}
            </style>
            <rect width=\"420\" height=\"200\" class=\"bg\" />
            <text x=\"25\" y=\"35\" class=\"header\">Most Used Languages</text>
            {lang_items_svg}
          </svg>'''

          with open('top-langs.svg', 'w', encoding='utf-8') as f:
              f.write(langs_svg)

          # Update README.md
          readme_section = textwrap.dedent('''<!--START_SECTION:stats-->
          <p align=\"center\">
            <img src=\"github-stats.svg\" alt=\"GitHub Stats\" />
            <img src=\"top-langs.svg\" alt=\"Top Languages\" />
          </p>
          <!--END_SECTION:stats-->''')

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'<!--START_SECTION:stats-->.*?<!--END_SECTION:stats-->'
          updated_content = re.sub(pattern, readme_section, content, flags=re.DOTALL)

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(updated_content)
          "

      - name: Commit and push generated cards & README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg README.md
          git diff --staged --quiet || git commit -m "Update dynamic GitHub stats SVG cards in README"
          git push || true
